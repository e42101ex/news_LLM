# 以下三個站沒有可用的 RSS，改用其他方式抓：
# type = "html"    → 抓列表頁符合 link_pattern 的連結，再逐篇讀 og / JSON-LD metadata
# type = "wp_json" → WordPress REST API（RSS 被 Cloudflare 擋 403 時的替代）
[[sources]]
name = "DIGITIMES"
type = "html"
url = "https://www.digitimes.com.tw/tech/"
link_pattern = "shwnws\\.asp\\?.*id="
max_items = 40
lang = "zh"
ai_only = false

[[sources]]
name = "數位時代"
type = "html"
url = "https://www.bnext.com.tw/categories/ai"
link_pattern = "/article/\\d+"
max_items = 25
lang = "zh"
ai_only = false

[[sources]]
