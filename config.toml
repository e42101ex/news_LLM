# AI 每日新聞彙整設定檔
# ai_only = true  → 該來源整站都是 AI 內容，不做關鍵字過濾
# ai_only = false → 綜合科技媒體，只留下命中 AI 關鍵字的文章

[build]
hours = 30                 # 收錄多少小時內的新聞（30 給時區一點緩衝）
similarity = 0.26          # 分群門檻，越大越不容易被歸為同一主題
min_cluster_sources = 1    # 主題至少要有幾個來源才顯示
max_topics = 40
timezone = "Asia/Taipei"
site_title = "AI 每日新聞彙整"

[images]
# 新聞縮圖。來源：RSS 帶的圖 → 找不到就抓文章頁的 og:image。
#   mode = "local"   下載並裁成統一尺寸的 WebP 放進 docs/img/<日期>/
#                    （頁面自包含、存檔不會破圖；repo 每天約增加 0.5-1 MB）
#   mode = "hotlink" 直接連原站圖片（repo 不會長大，但存檔頁日後可能破圖）
#   mode = "off"     不放縮圖
mode = "local"
width = 400
height = 267               # 3:2，裁切成統一比例讓卡片整齊
quality = 72
og_fallback = true         # RSS 沒帶圖時去抓文章頁的 og:image
keep_days = 60             # local 模式：清掉幾天前的圖片目錄
timeout = 12
workers = 8
generic_threshold = 3     # 同一張圖被 N 個以上主題共用＝站台預設圖，丟棄

[llm]
# 摘要用的 LLM。API key 一律走環境變數或 .env，不要寫在這個檔案裡。
#   provider = "openai"    → 任何 OpenAI-compatible 的 /v1/chat/completions
#   provider = "anthropic" → 直接走 Anthropic Messages API
provider = "openai"
base_url = ""              # 例："https://your-gateway.example.com/v1"（可用 LLM_BASE_URL 覆寫）
model = ""                 # 例："gpt-4o-mini"、"qwen2.5-72b-instruct"（可用 LLM_MODEL 覆寫）
temperature = 0.2
max_tokens = 8000          # 推理型模型建議調高（例如 16000）
timeout = 180              # 單次請求秒數
batch_size = 12            # 一次請模型整理幾個主題
json_mode = "auto"         # auto｜json_schema｜json_object｜prompt
effort = "high"            # 只有 provider = "anthropic" 會用到

# 少數 gateway 需要額外 header，例如：
# [llm.extra_headers]
# "X-Tenant-Id" = "your-team"

